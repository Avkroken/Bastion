# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Behåll organisationens CodeRabbit-inställningar men gör review-signalen explicit
# och fail-closed för detta repository.
inheritance: true

reviews:
  # Legacy commit-status kan rapportera success vid rate limit och får därför
  # inte användas som mergebevis.
  review_progress: true
  fail_commit_status: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
