# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Behåll organisationens CodeRabbit-inställningar men gör review-signalen explicit
# och användbar som best-effort-review. CodeRabbit är inte en required mergegate.
inheritance: true

reviews:
  # Legacy commit-status ska inte tolkas som mergebevis; faktiska findings
  # hanteras via review och thread resolution.
  review_progress: true
  fail_commit_status: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
