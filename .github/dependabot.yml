# To get started with Dependabot version updates, specify each package
# ecosystem and the directory that contains its manifest.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep the exact Package.swift pin until apple/swift-nio#3647 is fixed.
      - dependency-name: "swift-nio"

  - package-ecosystem: "bundler"
    directory: "/App"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/LinuxApp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directories:
      - "/Android"
      - "/Android/app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directories:
      - "/WindowsApp"
      - "/WindowsApp/Bastion.Core"
      - "/WindowsApp/Bastion.Core.Tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
