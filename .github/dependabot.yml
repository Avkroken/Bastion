version: 2
updates:
  - package-ecosystem: "swift"
    directories:
      - "/"
      - "/LinuxApp"
      - "/WindowsApp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Europe/Stockholm"
    groups:
      swift-patch-minor:
        update-types: ["minor", "patch"]
    ignore:
      # Exakt pinnad i Package.swift (just nu 2.101.3, dvs. senaste releasen —
      # pinningen håller alltså inte tillbaka versionen) för att kringgå
      # apple/swift-nio#3647 (Windows Sendable/IPPROTO-kompileringsfel).
      # Renovates automatiska bump av pinnen (PR #153) återinförde exakt den
      # bugg PR #149 fixade. Ta inte bort förrän uppströms löst #3647; se
      # kommentaren i Package.swift. Kontrollerat 2026-08-11: #3647 öppen.
      # Endast exakt paketnamn (ingen wildcard) så swift-nio-ssh inte fryses.
      - dependency-name: "swift-nio"

  # App/Gemfile.lock (fastlane) saknade tidigare ekosystem här, så gems
  # uppdaterades aldrig — därav den kvarliggande json-alerten.
  - package-ecosystem: "bundler"
    directory: "/App"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:30"
      timezone: "Europe/Stockholm"
    groups:
      bundler-patch-minor:
        update-types: ["minor", "patch"]

  # LinuxApp/Cargo.toml — Rust-appens beroendeträd var helt obevakat.
  - package-ecosystem: "cargo"
    directory: "/LinuxApp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:40"
      timezone: "Europe/Stockholm"
    groups:
      cargo-patch-minor:
        update-types: ["minor", "patch"]

  # Android/*.gradle.kts — helt obevakat.
  - package-ecosystem: "gradle"
    directories:
      - "/Android"
      - "/Android/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:50"
      timezone: "Europe/Stockholm"
    groups:
      gradle-patch-minor:
        update-types: ["minor", "patch"]

  # WindowsApp/*.csproj — helt obevakat.
  - package-ecosystem: "nuget"
    directories:
      - "/WindowsApp"
      - "/WindowsApp/Bastion.Core"
      - "/WindowsApp/Bastion.Core.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:55"
      timezone: "Europe/Stockholm"
    groups:
      nuget-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]
