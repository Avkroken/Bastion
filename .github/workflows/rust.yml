name: Rust

on:
  workflow_dispatch:
  repository_dispatch:
    types: [agent-pr-merged]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust
    if: github.event_name != 'repository_dispatch' || github.sha == github.event.client_payload.merge_sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: LinuxApp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.merge_sha || '' }}
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libgtksourceview-5-dev pkg-config
      - name: Set up Rust toolchain
        run: rustup override set stable
      - name: Build
        run: cargo build --workspace --verbose
      - name: Run tests
        run: cargo test --workspace --verbose
