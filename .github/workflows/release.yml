name: Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/semantic_release.py"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Optional forced SemVer bump
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate semantic release
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and changelog calculation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/semantic_release.py \
            --forced-bump auto \
            --notes "${RUNNER_TEMP}/release-notes.md"

  release:
    name: Semantic release
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate version and changelog
        id: release
        shell: bash
        env:
          FORCED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'auto' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/semantic_release.py \
            --forced-bump "${FORCED_BUMP}" \
            --notes "${RUNNER_TEMP}/release-notes.md" \
            --output "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        if: ${{ steps.release.outputs.release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
