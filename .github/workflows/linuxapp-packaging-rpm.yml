name: Linux app RPM package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpm-linuxapp:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'mp100-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build package
        env:
          VERSION: ${{ steps.version.outputs.version || '0.0.0' }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          mkdir -p dist-out
          docker run --rm -v "$PWD:/work" -e VERSION -e REPOSITORY_URL fedora:40 bash /work/LinuxApp/packaging/build-rpm.sh
      - name: Smoke test package
        run: |
          docker run --rm -v "$PWD/dist-out:/dist-out:ro" fedora:40 bash -euo pipefail -c '
            dnf install -y -q /dist-out/*.rpm xorg-x11-server-Xvfb dbus-x11 mesa-libGLES
            Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; sleep 1
            dbus-run-session -- bastion-linuxapp >/tmp/app.log 2>&1 & app=$!; sleep 5
            kill -0 "$app"
            kill "$app"
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bastion-linuxapp-rpm
          path: dist-out/*.rpm
