name: Synka grenpoolen med huvudgrenen

# Arbete sker i en sluten pool av grenar:
#   work/feature  ny funktionalitet
#   work/fix      buggfixar och CI-problem
#   work/chore    städning, konfiguration
#   docs/content  dokumentation och textinnehåll
#   platform/*   plattformsspecifika permanenta arbetsgrenar
#   core/swift   delad Swift/core-slot
# Rulesetet `lock` blockerar skapande av allt annat. Poolens grenar är
# undantagna med exakta refnamn, så poolen kan inte växa men den här
# workflowen kan återskapa en slot som råkat försvinna.
#
# INVARIANT:
#   - En slot utan öppen PR ska peka exakt på aktuell huvudgren.
#   - En slot med öppen PR får innehålla endast det aktiva PR-arbetet ovanpå
#     aktuell huvudgren och rebasas när huvudgrenen flyttas.
#
# Detta är avsiktligt strikt. Squash-merge bevarar inte commit-identitet, så
# gamla slot-commits får aldrig användas som historik efter att PR:n är klar.
# När en PR mergas eller stängs återställs sloten därför direkt till main.
#
# En dedikerad GitHub App-token används för pushar. Appen måste kunna bypassa
# non_fast_forward för poolgrenarna eftersom lediga slots återställs med en
# force-with-lease till exakt huvudgrens-SHA. Lease-villkoret förhindrar att
# parallella ändringar skrivs över.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: sync-pool
  cancel-in-progress: false

permissions:
  contents: read

env:
  SLOTS: "work/feature work/fix work/chore docs/content platform/windows platform/android platform/linux platform/apple platform/cli core/swift"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta automation App-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write
          permission-pull-requests: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Synka varje slot med huvudgrenen
        env:
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git fetch origin "$BASE"; then
            echo "::error::Kunde inte hämta huvudgrenen $BASE."
            exit 1
          fi
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          OWNER="${GITHUB_REPOSITORY%%/*}"
          FAILED=""

          for SLOT in $SLOTS; do
            echo "::group::$SLOT"

            if ! git ls-remote --exit-code --heads origin "$SLOT" >/dev/null 2>&1; then
              echo "$SLOT finns inte — skapar den från $BASE."
              if ! git push origin "$BASE_SHA:refs/heads/$SLOT"; then
                echo "::warning::Kunde inte skapa $SLOT."
                FAILED="$FAILED $SLOT"
              fi
              echo "::endgroup::"
              continue
            fi

            if ! git fetch origin "$SLOT"; then
              echo "::warning::Kunde inte hämta $SLOT."
              FAILED="$FAILED $SLOT"
              echo "::endgroup::"
              continue
            fi
            PREV=$(git rev-parse FETCH_HEAD)

            # Läs PR-läget INNAN vi bestämmer om sloten ska rebasas eller resetas.
            # Om API:t inte kan läsas gör vi ingen destruktiv ändring.
            OPEN_PRS=""
            if OPEN_PRS_RAW="$(gh api -H 'Accept: application/vnd.github+json' \
                 "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${SLOT}&per_page=100" \
                 --jq 'length' 2>/dev/null)"; then
              case "$OPEN_PRS_RAW" in
                ''|*[!0-9]*) OPEN_PRS="" ;;
                *)           OPEN_PRS="$OPEN_PRS_RAW" ;;
              esac
            fi

            if [ -z "$OPEN_PRS" ]; then
              echo "::warning::Kunde inte läsa öppna PR:er för $SLOT — lämnas orörd."
              FAILED="$FAILED $SLOT"
              echo "::endgroup::"
              continue
            fi

            if [ "$OPEN_PRS" -eq 0 ]; then
              # Hård invariant för ledig slot: exakt samma commit som main.
              if [ "$PREV" != "$BASE_SHA" ]; then
                echo "$SLOT är ledig. Återställer exakt till $BASE. Forkastad spets: $PREV"
                if ! git push --force-with-lease="refs/heads/$SLOT:$PREV" \
                     origin "$BASE_SHA:refs/heads/$SLOT"; then
                  echo "::warning::Kunde inte återställa ledig slot $SLOT."
                  FAILED="$FAILED $SLOT"
                  echo "::endgroup::"
                  continue
                fi
              else
                echo "$SLOT är ledig och redan exakt i nivå med $BASE."
              fi

              REMOTE_SHA=$(git ls-remote --heads origin "$SLOT" | awk '{print $1}')
              if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
                echo "::warning::Invariant bruten efter reset: $SLOT=$REMOTE_SHA, $BASE=$BASE_SHA."
                FAILED="$FAILED $SLOT"
              else
                echo "$SLOT verifierad: exakt $BASE_SHA."
              fi
              echo "::endgroup::"
              continue
            fi

            # Aktiv PR: bevara endast aktuellt PR-arbete genom att rebasa sloten
            # på huvudgrenen. Vid konflikt kastas inget automatiskt.
            if [ "$PREV" = "$BASE_SHA" ]; then
              echo "$SLOT har $OPEN_PRS öppen PR men inga commits ovanpå $BASE ännu."
              echo "::endgroup::"
              continue
            fi

            git checkout -B "sync-$SLOT" "$PREV" >/dev/null 2>&1
            if ! git rebase --empty=drop "$BASE_SHA"; then
              git rebase --abort || true
              echo "::warning::$SLOT har $OPEN_PRS öppen PR och gav konflikt vid rebase — lämnas orörd."
              FAILED="$FAILED $SLOT"
              echo "::endgroup::"
              continue
            fi

            if [ "$(git rev-parse HEAD)" = "$PREV" ]; then
              echo "$SLOT: aktiv PR, inget att göra."
              echo "::endgroup::"
              continue
            fi

            LEFT=$(git rev-list --count "$BASE_SHA..HEAD")
            echo "$SLOT rebasad ovanpå $BASE. $LEFT aktiv(a) commit(s) kvar."
            if ! git push --force-with-lease="refs/heads/$SLOT:$PREV" \
                 origin "HEAD:refs/heads/$SLOT"; then
              echo "::warning::Kunde inte pusha $SLOT (grenen kan ha ändrats under körningen)."
              FAILED="$FAILED $SLOT"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Slots som inte kunde synkas:$FAILED. Löses för hand."
            exit 1
          fi
