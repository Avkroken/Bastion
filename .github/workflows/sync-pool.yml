name: Synka grenpoolen med huvudgrenen

# Återanvändbara slots:
#   work/feature  ny funktionalitet
#   work/fix      buggfixar och CI-problem
#   work/chore    städning, konfiguration
#   docs/content  dokumentation och textinnehåll
# Permanenta grenar:
#   platform/*   plattformsspecifika permanenta arbetsgrenar
#   core/swift   delad Swift/core-slot
#
# Tillfälliga/återanvändbara slots som watchdoggen bevakar får grace och
# bevaras tills en PR faktiskt skyddar arbetet. Permanenta grenar behåller
# Bastions repo-specifika synkmodell och är undantagna från watchdoggen.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: sync-pool
  cancel-in-progress: false

permissions:
  contents: read

env:
  SLOTS: "work/feature work/fix work/chore docs/content platform/windows platform/android platform/linux platform/apple platform/cli core/swift"
  WATCHDOG_GRACE_MINUTES: "70"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta automation App-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write
          permission-pull-requests: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Synka varje slot med huvudgrenen
        env:
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOSED_HEAD: ${{ github.event.pull_request.head.ref || '' }}
          CLOSED_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch origin "$BASE"; then echo "::error::Kunde inte hämta huvudgrenen $BASE."; exit 1; fi
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          OWNER="${GITHUB_REPOSITORY%%/*}"
          FAILED=""

          for SLOT in $SLOTS; do
            echo "::group::$SLOT"
            if ! git ls-remote --exit-code --heads origin "$SLOT" >/dev/null 2>&1; then
              if ! git push origin "$BASE_SHA:refs/heads/$SLOT"; then FAILED="$FAILED $SLOT"; fi
              echo "::endgroup::"; continue
            fi
            if ! git fetch origin "$SLOT"; then FAILED="$FAILED $SLOT"; echo "::endgroup::"; continue; fi
            PREV=$(git rev-parse FETCH_HEAD)
            OPEN_PRS=""
            if OPEN_PRS_RAW="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${OWNER}:${SLOT}&base=${BASE}&per_page=100" --jq 'length' 2>/dev/null)"; then
              case "$OPEN_PRS_RAW" in ''|*[!0-9]*) OPEN_PRS="" ;; *) OPEN_PRS="$OPEN_PRS_RAW" ;; esac
            fi
            if [ -z "$OPEN_PRS" ]; then FAILED="$FAILED $SLOT"; echo "::endgroup::"; continue; fi

            if [ "$OPEN_PRS" -eq 0 ]; then
              if [ "$PREV" != "$BASE_SHA" ]; then
                AHEAD=$(git rev-list --count "$BASE_SHA..$PREV" 2>/dev/null || echo 0)
                BEHIND=$(git rev-list --count "$PREV..$BASE_SHA" 2>/dev/null || echo 0)
                case "$SLOT" in
                  work/*|docs/content)
                    if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && \
                       [ "${CLOSED_HEAD:-}" = "$SLOT" ] && \
                       [ "${CLOSED_HEAD_SHA:-}" = "$PREV" ]; then
                      echo "$SLOT hör till stängd PR och tippen matchar; återställs direkt."
                    elif [ "$AHEAD" -gt 0 ] && [ "$BEHIND" -eq 0 ]; then
                      COMMITTED_AT=$(git show -s --format=%ct "$PREV" 2>/dev/null || echo 0)
                      NOW=$(date +%s); AGE_MINUTES=$(( (NOW - COMMITTED_AT) / 60 ))
                      if [ "$COMMITTED_AT" -gt 0 ] && [ "$AGE_MINUTES" -lt "$WATCHDOG_GRACE_MINUTES" ]; then echo "$SLOT har oskyddat arbete (${AGE_MINUTES} min); lämnas för watchdog."; else echo "$SLOT saknar durabelt PR-skydd; lämnas orörd tills watchdog öppnat PR."; fi
                      echo "::endgroup::"; continue
                    elif [ "$AHEAD" -gt 0 ] && [ "$BEHIND" -gt 0 ]; then
                      echo "$SLOT är divergerad; rebasar oskyddat arbete på $BASE innan watchdog får öppna PR."
                      git checkout -B "sync-$SLOT" "$PREV" >/dev/null 2>&1
                      if ! git rebase --empty=drop "$BASE_SHA"; then git rebase --abort || true; FAILED="$FAILED $SLOT"; echo "::endgroup::"; continue; fi
                      if ! git push --force-with-lease="refs/heads/$SLOT:$PREV" origin "HEAD:refs/heads/$SLOT"; then FAILED="$FAILED $SLOT"; fi
                      echo "::endgroup::"; continue
                    fi ;;
                esac
                if ! git push --force-with-lease="refs/heads/$SLOT:$PREV" origin "$BASE_SHA:refs/heads/$SLOT"; then FAILED="$FAILED $SLOT"; echo "::endgroup::"; continue; fi
              fi
              REMOTE_SHA=$(git ls-remote --heads origin "$SLOT" | awk '{print $1}')
              [ "$REMOTE_SHA" = "$BASE_SHA" ] || FAILED="$FAILED $SLOT"
              echo "::endgroup::"; continue
            fi

            if [ "$PREV" = "$BASE_SHA" ]; then echo "::endgroup::"; continue; fi
            git checkout -B "sync-$SLOT" "$PREV" >/dev/null 2>&1
            if ! git rebase --empty=drop "$BASE_SHA"; then git rebase --abort || true; FAILED="$FAILED $SLOT"; echo "::endgroup::"; continue; fi
            if [ "$(git rev-parse HEAD)" != "$PREV" ]; then
              if ! git push --force-with-lease="refs/heads/$SLOT:$PREV" origin "HEAD:refs/heads/$SLOT"; then FAILED="$FAILED $SLOT"; fi
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then echo "::error::Slots som inte kunde synkas:$FAILED"; exit 1; fi
