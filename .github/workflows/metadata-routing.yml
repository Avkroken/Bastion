name: Central metadata routing

on:
  issues:
    types: [labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened]

concurrency:
  group: metadata-routing-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  issue:
    if: github.event_name == 'issues' && (startsWith(github.event.label.name, 'difficulty:') || startsWith(github.event.label.name, 'security:'))
    permissions:
      issues: write
    uses: Avkroken/.github/.github/workflows/metadata-routing.yml@df48146dd258d8807ace95ff45d4fee3f001c483
    with:
      item-kind: issue
      item-number: ${{ github.event.issue.number }}

  pull-request:
    if: github.event_name == 'pull_request_target'
    permissions:
      issues: write
    uses: Avkroken/.github/.github/workflows/metadata-routing.yml@df48146dd258d8807ace95ff45d4fee3f001c483
    with:
      item-kind: pull_request
      item-number: ${{ github.event.pull_request.number }}
