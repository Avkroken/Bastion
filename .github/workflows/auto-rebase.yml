name: Auto-Update PRs

# Håller öppna PR:er uppdaterade mot main automatiskt, så att
# "Require branches to be up to date before merging" inte blir manuellt arbete.
#
# Två saker är avgörande här:
#
# 1. Uppdateringen görs med APPTOKEN, inte GITHUB_TOKEN. updateBranch pushar en
#    ny commit till PR-branchen; görs den med GITHUB_TOKEN triggar den inga
#    workflows (ACCESS-STANDARD regel 1). PR:en får då en ny head UTAN checkar
#    och fastnar permanent bakom strict-kravet — tyst, och svårt att felsöka.
#
# 2. Alla öppna PR:er uppdateras, inte bara etiketterade. En etikettbaserad
#    filtrering betyder att den PR någon glömt etikettera blir stående, vilket
#    är samma "det glöms bort"-problem som allt annat.
#
# Dependabot undantas medvetet: den rebasar sina egna PR:er när basen rör sig,
# och två parter som uppdaterar samma branch skapar bara konflikter.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Uppdatera öppna PR-brancher mot main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            // Dependabot sköter sina egna rebaser.
            const targets = prs.filter(pr =>
              pr.user.login !== 'dependabot[bot]' && !pr.draft
            );

            let updated = 0, current = 0, failed = 0;
            for (const pr of targets) {
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                updated++;
                core.info(`#${pr.number} uppdaterad`);
              } catch (e) {
                // 422 = redan à jour, eller konflikt som kräver människa.
                if (e.status === 422) {
                  current++;
                  core.info(`#${pr.number} redan à jour eller har konflikt`);
                } else {
                  failed++;
                  core.warning(`#${pr.number} kunde inte uppdateras: ${e.message}`);
                }
              }
            }

            core.notice(
              `${targets.length} öppna PR:er: ${updated} uppdaterade, ` +
              `${current} redan à jour, ${failed} misslyckades`
            );

            // Ett misslyckande är inte tyst: strict-kravet gör att en PR som
            // inte kunde uppdateras heller inte kan mergas.
            if (failed > 0) {
              core.setFailed(`${failed} PR:er kunde inte uppdateras`);
            }
