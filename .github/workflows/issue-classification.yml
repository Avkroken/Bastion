name: AI issue classification

on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  classify:
    permissions:
      contents: read
      issues: write
    uses: Avkroken/.github/.github/workflows/issue-classification.lock.yml@aa234f01290aa3e564a93d75f64b437203c47aee
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  route:
    needs: classify
    permissions:
      issues: write
    uses: Avkroken/.github/.github/workflows/metadata-routing.yml@aa234f01290aa3e564a93d75f64b437203c47aee
    with:
      item-kind: issue
      item-number: ${{ github.event.issue.number }}
