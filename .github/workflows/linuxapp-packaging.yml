name: Linux app Debian package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linuxapp-debian-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deb-linuxapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LinuxApp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        working-directory: .
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libgtksourceview-5-dev pkg-config binutils
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo build --release
      - id: deps
        run: |
          set -euo pipefail
          needed=$(LC_ALL=C readelf -d target/release/bastion-linuxapp | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
          packages=()
          while IFS= read -r lib; do
            [[ -n "$lib" ]] || continue
            case "$lib" in libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libutil.so*|libgcc_s.so*|ld-linux*|linux-vdso*) continue;; esac
            path=$(ldconfig -p | awk -v lib="$lib" '$1 == lib && $0 ~ /x86-64/ { print $NF; exit }')
            [[ -n "$path" ]] || { echo "::error::Could not locate $lib"; exit 1; }
            pkg=$(dpkg -S "$(readlink -f "$path")" | head -1 | cut -d: -f1 | cut -d, -f1 | xargs)
            [[ -n "$pkg" ]] || { echo "::error::Could not map $lib to a Debian package"; exit 1; }
            packages+=("$pkg")
          done <<< "$needed"
          extra=$(printf '%s\n' "${packages[@]}" | sort -u | grep -v '^$' | grep -v '^libc6$' | paste -sd, - | sed 's/,/, /g')
          echo "depends=libc6${extra:+, $extra}" >> "$GITHUB_OUTPUT"
      - name: Build package
        env:
          VERSION: ${{ steps.version.outputs.version || '0.0.0' }}
          DEPENDS: ${{ steps.deps.outputs.depends }}
        run: |
          root="dist/bastion-linuxapp_${VERSION}_amd64"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/applications" dist-out
          install -m 755 target/release/bastion-linuxapp "$root/usr/bin/bastion-linuxapp"
          cp packaging/bastion-linuxapp.desktop "$root/usr/share/applications/"
          cat > "$root/DEBIAN/control" <<EOF
          Package: bastion-linuxapp
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: blixten85 <noreply@github.com>
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Depends: $DEPENDS
          Description: Bastion GTK4 SSH client
          EOF
          dpkg-deb --build --root-owner-group "$root"
          mv "dist/bastion-linuxapp_${VERSION}_amd64.deb" dist-out/
      - name: Smoke test package
        run: |
          docker run --rm -v "$PWD/dist-out:/dist-out:ro" -e DEBIAN_FRONTEND=noninteractive ubuntu:24.04 bash -euo pipefail -c '
            apt-get update -q
            apt-get install -y -q --no-install-recommends /dist-out/*.deb xvfb dbus-x11
            Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; sleep 1
            dbus-run-session -- bastion-linuxapp >/tmp/app.log 2>&1 & app=$!; sleep 5
            kill -0 "$app"
            kill "$app"
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bastion-linuxapp-deb
          path: LinuxApp/dist-out/*.deb
