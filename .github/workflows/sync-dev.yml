name: Sync dev with main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forwarda dev till main
        run: |
          set -euo pipefail
          git fetch origin dev
          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "::error::dev innehåller commits som inte finns i main; vägrar skriva över pågående arbete."
            exit 1
          fi
          git push origin HEAD:dev
