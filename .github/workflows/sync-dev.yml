name: Synka dev med main

# dev är den enda skrivbara grenen. main tar bara emot squash-mergade PR:er,
# vilket ger main en enda ny commit medan dev behåller sina ursprungliga.
# Utan den här workflowen divergerar grenarna för varje merge och nästa PR
# fylls av konflikter.
#
# Rebase, inte reset: arbete kan fortsätta på dev medan en PR är öppen. Efter
# merge ligger då både de mergade commitsen och de nya kvar på dev. Rebase
# hoppar över de patchar som redan finns i main och replayar bara resten, så
# osynkat arbete överlever medan det mergade försvinner.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Rebasa dev på main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if ! git fetch origin dev 2>/dev/null; then
            echo "dev finns inte — skapar den från main."
            git push origin "origin/main:refs/heads/dev"
            exit 0
          fi

          FÖRE=$(git rev-parse origin/dev)
          if [ "$FÖRE" = "$(git rev-parse origin/main)" ]; then
            echo "dev är redan i nivå med main."
            exit 0
          fi

          git checkout -B dev "$FÖRE"
          # --empty=drop tar bort commits vars innehåll redan finns i main,
          # alltså precis de som nyss squash-mergades.
          if ! git rebase --empty=drop origin/main; then
            git rebase --abort || true
            echo "::error::Rebase av dev på main gav konflikt. Löses för hand."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" = "$FÖRE" ]; then
            echo "Inget att göra."
            exit 0
          fi

          KVAR=$(git rev-list --count origin/main..HEAD)
          echo "dev rebasad på main. $KVAR commit(s) kvar som inte är mergade."
          git push --force-with-lease="refs/heads/dev:$FÖRE" origin HEAD:refs/heads/dev
