name: CLI RPM package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-rpm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: swift:6.1-rhel-ubi9
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: swift build -c release --product bastion-cli --static-swift-stdlib
      - run: dnf install -y -q rpm-build binutils
      - id: deps
        run: |
          set -euo pipefail
          needed=$(readelf -d .build/release/bastion-cli | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
          if grep -qi libswift <<<"$needed"; then
            echo "::error::bastion-cli still depends on the dynamic Swift runtime."
            exit 1
          fi
          packages=()
          while IFS= read -r lib; do
            [[ -n "$lib" ]] || continue
            case "$lib" in libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libutil.so*|ld-linux*|linux-vdso*) continue;; esac
            path=$(ldconfig -p | awk -v lib="$lib" '$1 == lib { print $NF; exit }')
            [[ -n "$path" ]] || { echo "::error::Could not locate $lib"; exit 1; }
            pkg=$(rpm -qf --qf '%{NAME}\n' "$(readlink -f "$path")" | head -1)
            [[ -n "$pkg" ]] || { echo "::error::Could not map $lib to an RPM package"; exit 1; }
            packages+=("$pkg")
          done <<< "$needed"
          extra=$(printf '%s\n' "${packages[@]}" | sort -u | grep -v '^$' | grep -v '^glibc$' | paste -sd' ' -)
          echo "requires=glibc${extra:+ $extra}" >> "$GITHUB_OUTPUT"
      - name: Build package
        env:
          VERSION: ${{ steps.version.outputs.version || '0.0.0' }}
          REQUIRES: ${{ steps.deps.outputs.requires }}
        run: |
          top="$PWD/rpmbuild"
          mkdir -p "$top"/{SPECS,SOURCES,BUILD,BUILDROOT,RPMS,SRPMS} dist-out
          cat > "$top/SPECS/bastion-cli.spec" <<EOF
          %global debug_package %{nil}
          Name: bastion-cli
          Version: $VERSION
          Release: 1%{?dist}
          Summary: Bastion SSH command-line client
          License: MIT
          URL: https://github.com/${GITHUB_REPOSITORY}
          Requires: $REQUIRES
          %description
          Bastion SSH command-line client.
          %install
          mkdir -p %{buildroot}/usr/bin
          cp $GITHUB_WORKSPACE/.build/release/bastion-cli %{buildroot}/usr/bin/bastion-cli
          %files
          /usr/bin/bastion-cli
          EOF
          rpmbuild --define "_topdir $top" -bb "$top/SPECS/bastion-cli.spec"
          find "$top/RPMS" -name '*.rpm' -exec mv {} dist-out/ \;
          rpm -i dist-out/*.rpm
          set +e; output=$(bastion-cli 2>&1); status=$?; set -e
          test "$status" -eq 2
          grep -q 'Användning:' <<<"$output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bastion-cli-rpm
          path: dist-out/*.rpm
