name: Auto assign issues and pull requests

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    name: Assign owner
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign issue or pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ format('{0}', github.event.issue.number || github.event.pull_request.number) }}
          ASSIGNEE: ${{ github.event.repository.owner.type == 'User' && github.repository_owner || vars.AUTO_ASSIGN_USER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid issue or PR number."; exit 1; }
          if [[ -z "${ASSIGNEE:-}" ]]; then
            echo "::notice::No individual assignee configured for organization-owned repository. Set Actions variable AUTO_ASSIGN_USER."
            exit 0
          fi
          if [[ ! "${ASSIGNEE}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37})$ ]]; then
            echo "::error::AUTO_ASSIGN_USER must be an individual GitHub login."
            exit 1
          fi
          payload="$(jq -cn --arg assignee "$ASSIGNEE" '{assignees: [$assignee]}')"
          gh api --method POST --header "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" --input - <<<"$payload" >/dev/null
