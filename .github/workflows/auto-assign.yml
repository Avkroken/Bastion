name: Auto-assign PR

# GitHub tilldelar aldrig PR-författaren automatiskt, och dependabot.yml:s
# `assignees` täcker bara Dependabot. Den här workflowen sätter blixten85 som
# assignee på ALLA PR:er (egna, Renovate, CodeRabbit, forkar).
#
# pull_request_target (inte pull_request): fork-PR:er får annars ett read-only
# GITHUB_TOKEN och `gh pr edit` skulle ge 403. Säkert här eftersom workflowen
# aldrig checkar ut eller kör kod från PR:en — samma mönster som
# claude-assign-trigger.yml.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

concurrency:
  group: auto-assign-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      # --add-assignee är idempotent, så en redan tilldelad Dependabot-PR
      # ger ingen dubblett och inget fel.
      - name: Assign blixten85
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee blixten85
