name: Dependabot queue events

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  queue:
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    uses: Avkroken/.github/.github/workflows/dependabot-automerge.yml@main
    with:
      app-client-id: ${{ vars.GAMNACKEN_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.GAMNACKEN_PRIVATE_KEY }}
