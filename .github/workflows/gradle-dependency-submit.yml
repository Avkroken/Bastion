name: Submit Gradle dependency graph

on:
  workflow_run:
    workflows: [Java CI with Gradle]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  submit:
    name: Submit dependency graph
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - name: Download and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
