name: Linux-paketering (bastion-gui, .deb)

# Paketerar bastion-gui (LinuxApp/, SwiftCrossUI/GTK4) som ett .deb-paket —
# GUI-halvan av ROADMAP.md:s "Paketering + BSD-täckning" (bastion-cli täcks
# redan av linux-packaging.yml/linux-packaging-rpm.yml).
#
# Byggs INTE i swift:6.1-noble-containern som CLI-paketen — bastion-gui drar
# in SwiftCrossUI, vars kärnmodul kraschar stabila Swift 6.1.3 (swift-mutex-
# buggen, swiftlang/swift#80759). Toolchain-hämtningen nedan är kopierad rakt
# av från linux-gui.yml (samma dev-snapshot-strategi, se den filens
# kommentarer för bakgrund) — separat jobb/fil för att inte koppla ihop det
# vanliga bygg+test-CI:t med paketeringssteget.
#
# Körtidsberoenden härleds FAKTISKT ur den byggda binärens egen DT_NEEDED-
# lista (readelf -d → dpkg -S), exakt samma teknik som linux-packaging.yml
# använder för bastion-cli — bara mycket LÄNGRE lista här (GTK4/GLib/Pango/
# Cairo/GdkPixbuf-familjen i stället för bara libcurl/libxml2), eftersom
# tekniken är generisk och inte bryr sig om HUR MÅNGA delade bibliotek
# binären råkar länka mot.
#
# Smoke-testet startar det FAKTISKT installerade paketets binär under en
# riktig (headless) Xvfb-X-server och verifierar att processen fortfarande
# lever efter några sekunder — bevisar att den härledda Depends-listan är
# TILLRÄCKLIG (inga saknade .so-filer vid körning), inte bara att `swift
# build` lyckades.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-packaging-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-gui-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Läs version (senaste v[0-9]*-tagg, annars 0.0.0)
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Installera GTK4-dev + Xvfb (bygg- resp. smoke-test-beroende)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev pkg-config xvfb

      # Följande fyra steg är kopierade rakt av från linux-gui.yml — se den
      # filens kommentarer för varför en dev-snapshot krävs.
      - name: Läs senaste Swift dev-snapshot-metadata (ubuntu24.04 — matchar runnerns OS)
        id: meta
        run: |
          set -euo pipefail
          curl -fsSL https://download.swift.org/development/ubuntu2404/latest-build.yml -o latest-build.yml
          DIR=$(grep '^dir:' latest-build.yml | cut -d' ' -f2)
          FILE=$(grep '^download:' latest-build.yml | cut -d' ' -f2)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Cacha toolchain (keyad på snapshot-id — samma snapshot laddas aldrig ner två gånger)
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: swift-toolchain
          key: swift-toolchain-ubuntu2404-${{ steps.meta.outputs.dir }}

      - name: Hämta + verifiera + extrahera Swift dev-snapshot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://download.swift.org/development/ubuntu2404/${{ steps.meta.outputs.dir }}"
          FILE="${{ steps.meta.outputs.file }}"
          curl -fsSL -o "swift.tar.gz" "$BASE/$FILE"
          curl -fsSL -o "swift.tar.gz.sig" "$BASE/$FILE.sig"
          curl --compressed -fsSL https://www.swift.org/keys/all-keys.asc | gpg --import
          gpg --verify swift.tar.gz.sig swift.tar.gz
          mkdir -p swift-toolchain
          tar xzf swift.tar.gz -C swift-toolchain --strip-components=1

      - name: Lägg toolchain i PATH
        run: echo "$PWD/swift-toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Visa Swift-version
        run: swift --version

      - name: swift build (release, statisk Swift-runtime)
        run: |
          cd LinuxApp
          swift build -c release --product bastion-gui --static-swift-stdlib

      # Samma teknik som linux-packaging.yml (bastion-cli): binärens EGNA
      # DT_NEEDED-lista, uppslagen mot Debian-paket via dpkg -S — inte en
      # gissning. `libswift`-kontrollen är fortfarande relevant här:
      # --static-swift-stdlib ska länka Swift-runtimen statiskt även för
      # bastion-gui, GTK4-beroendet i sig ändrar inte det.
      - name: Bestäm faktiska körtidsberoenden (DT_NEEDED → Debian-paket)
        id: deps
        run: |
          set -euo pipefail
          BIN=LinuxApp/.build/release/bastion-gui
          NEEDED=$(readelf -d "$BIN" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
          echo "Direkta delade bibliotek (DT_NEEDED):"
          echo "$NEEDED"

          if echo "$NEEDED" | grep -qi libswift; then
            echo "::error::bastion-gui beror fortfarande dynamiskt på Swift-runtimen — --static-swift-stdlib gav inte en fristående binär"
            exit 1
          fi

          PACKAGES=""
          for LIB in $NEEDED; do
            case "$LIB" in
              libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libutil.so*|ld-linux*|linux-vdso*)
                continue
                ;;
            esac
            LIBPATH=$(ldconfig -p | awk -v lib="$LIB" '$1 == lib { print $NF; exit }')
            if [ -z "$LIBPATH" ]; then
              echo "::error::hittar inte $LIB via ldconfig — kan inte slå upp vilket Debian-paket det tillhör"
              exit 1
            fi
            LIBPATH=$(readlink -f "$LIBPATH")
            PKG=$(dpkg -S "$LIBPATH" 2>/dev/null | head -1 | cut -d: -f1 | cut -d, -f1 | xargs)
            if [ -z "$PKG" ]; then
              echo "::error::$LIBPATH (från $LIB) tillhör inget känt Debian-paket"
              exit 1
            fi
            PACKAGES="$PACKAGES $PKG"
          done

          EXTRA=$(printf '%s\n' $PACKAGES | sort -u | grep -v '^$' | grep -v '^libc6$' | paste -sd, - | sed 's/,/, /g')
          DEPENDS="libc6${EXTRA:+, $EXTRA}"
          echo "Härledd Depends-rad: $DEPENDS"
          echo "depends=$DEPENDS" >> "$GITHUB_OUTPUT"

      - name: Bygg .deb-paketträd
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPENDS: ${{ steps.deps.outputs.depends }}
        run: |
          set -euo pipefail
          ROOT="dist/bastion-gui_${VERSION}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin"
          cp LinuxApp/.build/release/bastion-gui "$ROOT/usr/bin/bastion-gui"
          chmod 755 "$ROOT/usr/bin/bastion-gui"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: bastion-gui
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: blixten85 <noreply@github.com>
          Homepage: https://github.com/blixten85/bastion
          Depends: $DEPENDS
          Description: Fri, öppen, fristående SSH-klient (GTK4-GUI)
           bastion-gui — värdlista, dashboard, terminal, portvidarebefordran,
           Docker-hantering m.m. ovanpå samma SSHCore-kärna som bastion-cli.
           Statiskt länkad mot Swift-runtimen, inga körtidsberoenden utöver
           de i Depends.
          EOF
          dpkg-deb --build --root-owner-group "$ROOT"
          mkdir -p dist-out
          mv "dist/bastion-gui_${VERSION}_amd64.deb" dist-out/

      # Installerar det FAKTISKT byggda paketet och startar det under en
      # riktig (headless) X-server — bevisar att Depends-listan är
      # TILLRÄCKLIG (appen faktiskt startar och lever några sekunder), inte
      # bara att den installeras utan fel.
      - name: Installera och starta bastion-gui under Xvfb
        run: |
          set -euo pipefail
          sudo dpkg -i dist-out/*.deb

          Xvfb :99 -screen 0 1280x1024x24 &
          XVFB_PID=$!
          sleep 1
          export DISPLAY=:99

          bastion-gui &
          GUI_PID=$!
          sleep 5

          if ! kill -0 "$GUI_PID" 2>/dev/null; then
            echo "::error::bastion-gui avslutade oväntat direkt efter start under Xvfb — troligen ett saknat delat bibliotek (kontrollera Depends-listan ovan)"
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi

          echo "bastion-gui körde fortfarande efter 5s under Xvfb — startar rent."
          kill "$GUI_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

      - name: Ladda upp .deb-artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bastion-gui-deb
          path: dist-out/*.deb
          if-no-files-found: error
