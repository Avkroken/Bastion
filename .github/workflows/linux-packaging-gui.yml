name: Linux-paketering (bastion-gui, .deb)

# Paketerar bastion-gui (LinuxApp/, SwiftCrossUI/GTK4) som ett .deb-paket —
# GUI-halvan av ROADMAP.md:s "Paketering + BSD-täckning" (bastion-cli täcks
# redan av linux-packaging.yml/linux-packaging-rpm.yml).
#
# Byggs INTE i swift:6.1-noble-containern som CLI-paketen — bastion-gui drar
# in SwiftCrossUI, vars kärnmodul kraschar stabila Swift 6.1.3 (swift-mutex-
# buggen, swiftlang/swift#80759). Toolchain-hämtningen nedan är kopierad rakt
# av från linux-gui.yml (samma dev-snapshot-strategi, se den filens
# kommentarer för bakgrund) — separat jobb/fil för att inte koppla ihop det
# vanliga bygg+test-CI:t med paketeringssteget.
#
# Körtidsberoenden härleds FAKTISKT ur den byggda binärens egen DT_NEEDED-
# lista (readelf -d → dpkg -S), exakt samma teknik som linux-packaging.yml
# använder för bastion-cli — bara mycket LÄNGRE lista här (GTK4/GLib/Pango/
# Cairo/GdkPixbuf-familjen i stället för bara libcurl/libxml2), eftersom
# tekniken är generisk och inte bryr sig om HUR MÅNGA delade bibliotek
# binären råkar länka mot.
#
# TILL SKILLNAD FRÅN bastion-cli används INTE --static-swift-stdlib här
# (genuint CI-fynd: statisk länkning av FoundationInternationalization mot
# dev-snapshotens swift_static/-bibliotek misslyckas med en känd
# ICU-symbolbugg specifik för tarball-installerade dev-snapshots) — i
# stället byggs binären med DYNAMISK Swift-runtime, och toolchainens egna
# .so-filer BUNTAS IHOP i paketet (usr/lib/bastion-gui/ + en RPATH satt med
# patchelf), samma "inget Swift krävs på målmaskinen"-mål som
# --static-swift-stdlib skulle gett. Se kommentaren vid "swift build"-steget
# för detaljer.
#
# Smoke-testet startar det FAKTISKT installerade paketets binär under en
# riktig (headless) Xvfb-X-server och verifierar att processen fortfarande
# lever efter några sekunder — bevisar att den härledda Depends-listan är
# TILLRÄCKLIG (inga saknade .so-filer vid körning), inte bara att `swift
# build` lyckades.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-packaging-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-gui-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Läs version (senaste v[0-9]*-tagg, annars 0.0.0)
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Bara byggberoenden på VÄRDEN — xvfb installeras numera inuti den
      # friska containern i smoke-test-steget (se det steget för varför).
      - name: Installera GTK4-dev (byggberoende)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev pkg-config

      # Följande fyra steg är kopierade rakt av från linux-gui.yml — se den
      # filens kommentarer för varför en dev-snapshot krävs.
      - name: Läs senaste Swift dev-snapshot-metadata (ubuntu24.04 — matchar runnerns OS)
        id: meta
        run: |
          set -euo pipefail
          curl -fsSL https://download.swift.org/development/ubuntu2404/latest-build.yml -o latest-build.yml
          DIR=$(grep '^dir:' latest-build.yml | cut -d' ' -f2)
          FILE=$(grep '^download:' latest-build.yml | cut -d' ' -f2)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Cacha toolchain (keyad på snapshot-id — samma snapshot laddas aldrig ner två gånger)
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: swift-toolchain
          key: swift-toolchain-ubuntu2404-${{ steps.meta.outputs.dir }}

      - name: Hämta + verifiera + extrahera Swift dev-snapshot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://download.swift.org/development/ubuntu2404/${{ steps.meta.outputs.dir }}"
          FILE="${{ steps.meta.outputs.file }}"
          curl -fsSL -o "swift.tar.gz" "$BASE/$FILE"
          curl -fsSL -o "swift.tar.gz.sig" "$BASE/$FILE.sig"
          curl --compressed -fsSL https://www.swift.org/keys/all-keys.asc | gpg --import
          gpg --verify swift.tar.gz.sig swift.tar.gz
          mkdir -p swift-toolchain
          tar xzf swift.tar.gz -C swift-toolchain --strip-components=1

      - name: Lägg toolchain i PATH
        run: echo "$PWD/swift-toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Visa Swift-version
        run: swift --version

      # INTE --static-swift-stdlib här (till skillnad från bastion-cli i
      # linux-packaging.yml) — genuint CI-fynd: statisk länkning av
      # FoundationInternationalization mot dev-snapshotens
      # swift_static/-bibliotek misslyckas med "undefined reference to
      # 'swift_uloc_toLegacyKey'" m.fl. ICU-symboler när
      # SwiftCrossUIMacrosPlugin (ett makro-/kompilatorplugin som körs på
      # BYGGVÄRDEN, inte i den slutgiltiga binären) länkas. Detta är en känd
      # buggkategori specifikt för tarball-installerade dev-snapshots (till
      # skillnad från Docker-baserade toolchains, som bastion-clis
      # swift:6.1-noble-container aldrig haft problemet med) — se
      # swiftlang/swift-corelibs-foundation#3226 för samma symbolklass.
      # Löst genom att gå tillbaka till DYNAMISK länkning av Swift-runtimen
      # och i stället BUNTA IHOP toolchainens egna .so-filer i paketet med
      # en RPATH (samma "fristående, inget Swift krävs på målmaskinen"-mål
      # som --static-swift-stdlib skulle gett, bara med länkaren i stället
      # för statisk länkning) — se "Bestäm faktiska körtidsberoenden" nedan.
      - name: swift build (release, dynamisk Swift-runtime)
        run: |
          cd LinuxApp
          swift build -c release --product bastion-gui

      - name: Installera patchelf (för att sätta RPATH mot de buntade Swift-runtime-.so-filerna)
        run: sudo apt-get install -y -qq patchelf

      # Samma DT_NEEDED-teknik som linux-packaging.yml (bastion-cli), men
      # med ett extra steg: varje bibliotek som FAKTISKT finns i den
      # nedladdade toolchainens egen usr/lib/swift/linux/ (Swift-runtimen
      # själv, plus Foundation/Dispatch/ICU) buntas ihop i paketet i stället
      # för att slås upp mot ett Debian-paket — det finns inget sådant
      # (Swift är inte ett Ubuntu-apt-paket). Resten (GTK4/GLib/Pango/
      # Cairo/GdkPixbuf-familjen, riktiga systembibliotek) slås upp mot
      # Debian-paket precis som för bastion-cli.
      #
      # CodeRabbit-fynd (Major): en enkel for-loop över bara bastion-guis
      # EGEN DT_NEEDED-lista räcker INTE — de buntade Swift-biblioteken har
      # SJÄLVA egna beroenden (t.ex. FoundationInternationalization →
      # ICU-biblioteken) som aldrig syns i bastion-guis direkta lista.
      # `DT_RUNPATH` är dessutom INTE transitivt till barn-bibliotek (bara
      # till OBJEKTETS egna direkta beroenden, enligt ld.so(8)) — även om
      # de transitiva biblioteken buntades skulle de inte hittas utan att
      # VARJE buntat bibliotek har sin egen rpath. Löst med en riktig
      # arbetskö (BFS): varje buntat biblioteks EGEN DT_NEEDED-lista läggs
      # till i kön och genomsöks likadant, tills inga nya bibliotek hittas.
      - name: Bestäm faktiska körtidsberoenden (DT_NEEDED → buntat eller Debian-paket, transitivt)
        id: deps
        run: |
          set -euo pipefail
          BIN=LinuxApp/.build/release/bastion-gui
          SWIFT_LIB_DIR="$PWD/swift-toolchain/usr/lib/swift/linux"
          BUNDLE_DIR="$PWD/bundled-swift-libs"
          mkdir -p "$BUNDLE_DIR"

          PACKAGES=""
          SEEN=""
          QUEUE=$(readelf -d "$BIN" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
          echo "Direkta delade bibliotek (DT_NEEDED för bastion-gui):"
          echo "$QUEUE"

          while [ -n "$QUEUE" ]; do
            NEXT_QUEUE=""
            for LIB in $QUEUE; do
              case "$LIB" in
                libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libutil.so*|ld-linux*|linux-vdso*)
                  continue
                  ;;
              esac
              case " $SEEN " in
                *" $LIB "*) continue ;;
              esac
              SEEN="$SEEN $LIB"

              if [ -f "$SWIFT_LIB_DIR/$LIB" ]; then
                cp "$SWIFT_LIB_DIR/$LIB" "$BUNDLE_DIR/"
                # Detta biblioteks EGNA transitiva beroenden måste också
                # granskas — läggs till i nästa varv av kön i stället för
                # att antas vara redan täckta.
                CHILD_NEEDED=$(readelf -d "$SWIFT_LIB_DIR/$LIB" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
                NEXT_QUEUE="$NEXT_QUEUE $CHILD_NEEDED"
                continue
              fi

              LIBPATH=$(ldconfig -p | awk -v lib="$LIB" '$1 == lib { print $NF; exit }')
              if [ -z "$LIBPATH" ]; then
                echo "::error::hittar inte $LIB via ldconfig eller i Swift-toolchainen — kan inte slå upp vilket Debian-paket det tillhör"
                exit 1
              fi
              LIBPATH=$(readlink -f "$LIBPATH")
              PKG=$(dpkg -S "$LIBPATH" 2>/dev/null | head -1 | cut -d: -f1 | cut -d, -f1 | xargs)
              if [ -z "$PKG" ]; then
                echo "::error::$LIBPATH (från $LIB) tillhör inget känt Debian-paket"
                exit 1
              fi
              PACKAGES="$PACKAGES $PKG"
            done
            QUEUE="$NEXT_QUEUE"
          done

          echo "Buntade Swift-runtime-bibliotek (inklusive transitiva):"
          ls -1 "$BUNDLE_DIR"

          EXTRA=$(printf '%s\n' $PACKAGES | sort -u | grep -v '^$' | grep -v '^libc6$' | paste -sd, - | sed 's/,/, /g')
          DEPENDS="libc6${EXTRA:+, $EXTRA}"
          echo "Härledd Depends-rad: $DEPENDS"
          echo "depends=$DEPENDS" >> "$GITHUB_OUTPUT"

      - name: Bygg .deb-paketträd
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPENDS: ${{ steps.deps.outputs.depends }}
        run: |
          set -euo pipefail
          ROOT="dist/bastion-gui_${VERSION}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/lib/bastion-gui"
          cp LinuxApp/.build/release/bastion-gui "$ROOT/usr/bin/bastion-gui"
          chmod 755 "$ROOT/usr/bin/bastion-gui"
          # `bundled-swift-libs/*` (inte `*.so`) — CodeRabbit-fynd: ett `*.so`-
          # glob missar versionerade filnamn som `libicui18n.so.72`, och `||
          # true` hade tyst dolt att kopieringen misslyckats helt.
          cp bundled-swift-libs/* "$ROOT/usr/lib/bastion-gui/"

          # $ORIGIN är en särskild ELF-loader-token (INTE en skalvariabel —
          # måste vara enkelfnuttad här så bash inte försöker expandera den)
          # som pekar på det egna objektets katalog vid körning — gör
          # paketet flyttbart utan hårdkodad absolut sökväg.
          #
          # CodeRabbit-fynd (Major): DT_RUNPATH är INTE transitivt (ld.so(8)
          # — gäller bara objektets EGNA direkta beroenden, inte dess barns).
          # Att bara sätta rpath på huvudbinären räcker alltså inte: när
          # libswiftCore.so själv laddar libFoundationInternationalization.so
          # som i sin tur laddar ICU-biblioteken, måste VARJE steg i den
          # kedjan ha sin EGEN rpath. Alla buntade bibliotek ligger i samma
          # katalog, så $ORIGIN (pekar på den egna filens katalog) räcker för
          # dem alla.
          patchelf --set-rpath '$ORIGIN/../lib/bastion-gui' "$ROOT/usr/bin/bastion-gui"
          for LIB in "$ROOT"/usr/lib/bastion-gui/*; do
            patchelf --set-rpath '$ORIGIN' "$LIB"
          done

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: bastion-gui
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: blixten85 <noreply@github.com>
          Homepage: https://github.com/blixten85/bastion
          Depends: $DEPENDS
          Description: Fri, öppen, fristående SSH-klient (GTK4-GUI)
           bastion-gui — värdlista, dashboard, terminal, portvidarebefordran,
           Docker-hantering m.m. ovanpå samma SSHCore-kärna som bastion-cli.
           Swift-runtimen är buntad i /usr/lib/bastion-gui (RPATH), inga
           körtidsberoenden utöver de i Depends.
          EOF
          dpkg-deb --build --root-owner-group "$ROOT"
          mkdir -p dist-out
          mv "dist/bastion-gui_${VERSION}_amd64.deb" dist-out/

      # Installerar det FAKTISKT byggda paketet och startar det under en
      # riktig (headless) X-server — bevisar att Depends-listan är
      # TILLRÄCKLIG (appen faktiskt startar och lever några sekunder), inte
      # bara att den installeras utan fel.
      #
      # Körs i en HELT FRISK ubuntu:24.04-container, inte direkt på
      # runner-värden — CodeRabbit-fynd: `libgtk-4-dev` (steget "Installera
      # GTK4-dev + Xvfb" ovan) installerar redan GTK4-runtimebiblioteken på
      # värden som ett byggberoende, så en `dpkg -i` + körning DÄR hade
      # kunnat lyckas även om Depends-listan missat ett bibliotek — testet
      # hade bevisat fel sak. `apt-get install ./paket.deb` (inte `dpkg -i`)
      # löser dessutom Depends-raden på RIKTIGT via apt i den friska
      # containern, i stället för att bara kontrollera mot en redan
      # installerad paketdatabas.
      - name: Installera och starta bastion-gui under Xvfb (frisk container)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dist-out:/pkg:ro" \
            ubuntu:24.04 bash -ceu '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq xvfb libc-bin /pkg/*.deb

              # Precis, snabb kontroll INNAN Xvfb ens startas — CodeRabbit-
              # fynd: ldd följer den fullständiga (transitiva) loader-kedjan
              # rakt av, så den här kontrollen fångar exakt vilket bibliotek
              # som saknas om rpath-buntningen är ofullständig, i stället
              # för att bara se att processen dör inom 5s utan att veta
              # varför.
              if ldd /usr/bin/bastion-gui 2>&1 | grep -q "not found"; then
                echo "::error::bastion-gui har olösta delade bibliotek efter installation (rpath-buntningen är ofullständig):"
                ldd /usr/bin/bastion-gui | grep "not found"
                exit 1
              fi
              echo "ldd: alla delade bibliotek löstes (inklusive transitiva, via rpath)."

              Xvfb :99 -screen 0 1280x1024x24 &
              XVFB_PID=$!
              sleep 1
              export DISPLAY=:99

              bastion-gui &
              GUI_PID=$!
              sleep 5

              if ! kill -0 "$GUI_PID" 2>/dev/null; then
                echo "::error::bastion-gui avslutade oväntat direkt efter start under Xvfb i en frisk container — troligen ett saknat delat bibliotek (kontrollera Depends-listan ovan)"
                kill "$XVFB_PID" 2>/dev/null || true
                exit 1
              fi

              echo "bastion-gui körde fortfarande efter 5s under Xvfb i en frisk container — startar rent."
              kill "$GUI_PID" 2>/dev/null || true
              kill "$XVFB_PID" 2>/dev/null || true
            '

      - name: Ladda upp .deb-artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bastion-gui-deb
          path: dist-out/*.deb
          if-no-files-found: error
