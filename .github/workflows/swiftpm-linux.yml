name: SwiftPM-Linux-bygge

# Kärnan (SSHCore + bastion-cli, rot-paketet) påstås bygga på Linux OCH Apple
# (se CLAUDE.md/README) — men fram tills nu verifierades det bara på en
# macOS-runner (swiftpm-macos i xcode.yml). Rot-paketet beror inte på
# SwiftCrossUI (det ligger i LinuxApp/, ett eget paket), så det drabbas
# INTE av swift-mutex-kompilatorbuggen (swiftlang/swift#80759) som tvingar
# LinuxApp/ till en dev-snapshot-toolchain (se linux-gui.yml) — en vanlig
# stabil release räcker för rot-paketet.
#
# Workflowet triggas alltid för PR/push, men det dyra bygget körs bara när
# den versionsstyrda impact-detektorn visar att root-SwiftPM påverkas. Det
# undviker GitHubs fälla där workflow-level `paths:` kan lämna en required
# check permanent Pending.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: swiftpm-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      swift_core: ${{ steps.impact.outputs.swift_core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm CI-påverkan
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-impact.sh

  swiftpm-linux:
    needs: impact
    if: ${{ needs.impact.outputs.swift_core == 'true' }}
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Visa Swift-version
        run: swift --version

      # ArchiveOperationsTests kör riktiga tar/zip/unzip-underprocesser (se
      # ROADMAP.md "Zip/Tar") — swift:6.1-noble-avbildningen har tar men
      # inte zip/unzip förinstallerat (minimal image).
      - name: Installera zip/unzip (för ArchiveOperationsTests)
        run: |
          apt-get update -qq
          apt-get install -y -qq zip unzip

      - name: swift build (SSHCore + bastion-cli)
        run: swift build

      - name: swift test (SSHCore)
        run: swift test
