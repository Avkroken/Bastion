name: SwiftPM-Linux-bygge

# Kärnan (SSHCore + bastion-cli, rot-paketet) påstås bygga på Linux OCH Apple
# (se CLAUDE.md/README) — men fram tills nu verifierades det bara på en
# macOS-runner (swiftpm-macos i xcode.yml). Rot-paketet beror inte på
# SwiftCrossUI (det ligger i LinuxApp/, ett eget paket), så det drabbas
# INTE av swift-mutex-kompilatorbuggen (swiftlang/swift#80759) som tvingar
# LinuxApp/ till en dev-snapshot-toolchain (se linux-gui.yml) — Ubuntus egen
# `apt install swiftlang` (stabil 6.1.3) räcker för rot-paketet.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swiftpm-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftpm-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Installera Swift (stabil, apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swiftlang

      - name: Visa Swift-version
        run: swift --version

      - name: swift build (SSHCore + bastion-cli)
        run: swift build

      - name: swift test (SSHCore)
        run: swift test
