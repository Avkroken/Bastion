name: SwiftPM-Linux-bygge

# Kärnan (SSHCore + bastion-cli, rot-paketet) verifieras på Linux. PR-CI körs
# mot main; separat push-CI på dev behövs inte eftersom samma commit annars
# får både push- och pull_request-körningar när dev har en öppen PR.
# Det dyra bygget körs bara när impact-detektorn visar att root-SwiftPM påverkas.
on:
  # Merge-kön skickar merge_group.checks_requested. Utan den här
  # triggern svarar inget jobb och kön fastnar tills timeout.
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swiftpm-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      swift_core: ${{ steps.impact.outputs.swift_core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm CI-påverkan
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-impact.sh

  swiftpm-linux:
    needs: impact
    if: ${{ needs.impact.outputs.swift_core == 'true' }}
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Visa Swift-version
        run: swift --version

      - name: Installera zip/unzip (för ArchiveOperationsTests)
        run: |
          apt-get update -qq
          apt-get install -y -qq zip unzip

      - name: swift build (SSHCore + bastion-cli)
        run: swift build

      - name: swift test (SSHCore)
        run: swift test
