name: PR watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: pr-watchdog
  cancel-in-progress: false

env:
  MAX_UNPR_MINUTES: "60"
  STATE_BRANCH: "automation/pr-watchdog-state"
  STATE_PATH: ".pr-watchdog-state.json"
  PERMANENT_BRANCH_PATTERNS: "automation/pr-watchdog-state platform/* core/swift"

jobs:
  open-missing-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta automation App-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Öppna saknade PR:er och aktivera auto-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const base='main', stateBranch=process.env.STATE_BRANCH, statePath=process.env.STATE_PATH;
            const maxAgeMs=Number(process.env.MAX_UNPR_MINUTES)*60000, now=Date.now();
            const permanent=(process.env.PERMANENT_BRANCH_PATTERNS||'').split(/\s+/).filter(Boolean);
            const marker='Den här PR:n öppnades automatiskt av `PR watchdog`.';
            const isPermanent=(name)=>permanent.some((pattern)=>pattern.endsWith('/*')?name.startsWith(pattern.slice(0,-1)):name===pattern);
            let state={}, original='{}\n';
            try{const loaded=await github.rest.repos.getContent({owner,repo,path:statePath,ref:stateBranch});if(Array.isArray(loaded.data)||!loaded.data.content)throw new Error('Ogiltig watchdog-state');original=Buffer.from(loaded.data.content,'base64').toString('utf8');state=JSON.parse(original);}catch(error){if(error.status!==404)throw error;}
            const next={};
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            for(const branch of branches){const name=branch.name;if(name===base||name.startsWith('gh-readonly-queue/')||isPermanent(name))continue;core.startGroup(name);try{const headSha=branch.commit.sha;const comparison=await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:`${base}...${name}`});if(comparison.data.ahead_by===0)continue;const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',head:`${owner}:${name}`,base,per_page:100});let pr=open[0];if(pr){if(!(pr.body||'').includes(marker))continue;}else{const closed=await github.paginate(github.rest.pulls.list,{owner,repo,state:'closed',head:`${owner}:${name}`,base,per_page:100});if(closed.some((candidate)=>candidate.head?.sha===headSha))continue;const previous=state[name];const firstSeenAt=previous?.firstSeenAt||new Date(now).toISOString();next[name]={headSha,firstSeenAt};const firstSeenMs=Date.parse(firstSeenAt);if(!Number.isFinite(firstSeenMs)||now-firstSeenMs<=maxAgeMs)continue;const currentBranch=await github.rest.repos.getBranch({owner,repo,branch:name});if(currentBranch.data.commit.sha!==headSha)continue;const tip=await github.rest.repos.getCommit({owner,repo,ref:headSha});const ageMinutes=Math.floor((now-firstSeenMs)/60000);const title=(tip.data.commit.message||'').split('\n')[0].trim()||`auto: öppna PR för ${name}`;const body=[marker,'',`Branch \`${name}\` har saknat öppen PR med unika commits i ${ageMinutes} minuter.`,`Watchdog-tip: \`${headSha.slice(0,7)}\`.`, '', 'Watchdoggen bedömer inte om arbetet ska mergas. Auto-merge armeras direkt; required checks, relevanta review-trådar och merge queue måste fortfarande passera före squash merge.'].join('\n');try{pr=(await github.rest.pulls.create({owner,repo,head:name,base,title,body,draft:false,maintainer_can_modify:true})).data;}catch(error){if(error.status!==422)throw error;const raced=await github.rest.pulls.list({owner,repo,state:'open',head:`${owner}:${name}`,base,per_page:100});pr=raced.data[0];if(!pr||!(pr.body||'').includes(marker)){delete next[name];continue;}}delete next[name];}const node=await github.graphql(`query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id autoMergeRequest{enabledAt}}}}`,{owner,repo,number:pr.number});if(node.repository.pullRequest.autoMergeRequest)continue;await github.graphql(`mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{number}}}`,{id:node.repository.pullRequest.id});}finally{core.endGroup();}}
            const canonical=Object.fromEntries(Object.entries(next).sort(([a],[b])=>a.localeCompare(b)));const serialized=JSON.stringify(canonical,null,2)+'\n';
            if(serialized!==original){let stateSha;try{const existing=await github.rest.repos.getContent({owner,repo,path:statePath,ref:stateBranch});if(!Array.isArray(existing.data))stateSha=existing.data.sha;}catch(error){if(error.status!==404)throw error;try{await github.rest.git.getRef({owner,repo,ref:`heads/${stateBranch}`});}catch(refError){if(refError.status!==404)throw refError;const mainRef=await github.rest.git.getRef({owner,repo,ref:'heads/main'});await github.rest.git.createRef({owner,repo,ref:`refs/heads/${stateBranch}`,sha:mainRef.data.object.sha});}}await github.rest.repos.createOrUpdateFileContents({owner,repo,path:statePath,branch:stateBranch,message:'chore: update PR watchdog state',content:Buffer.from(serialized).toString('base64'),...(stateSha?{sha:stateSha}:{})});}
