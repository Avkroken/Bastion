name: PR watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: pr-watchdog
  cancel-in-progress: false

env:
  MAX_UNPR_MINUTES: "60"
  PERMANENT_BRANCH_PATTERNS: "platform/* core/swift"

jobs:
  open-missing-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta automation App-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Öppna saknade PR:er och aktivera auto-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const base=context.payload.repository?.default_branch||'main';
            const maxAgeMs=Number(process.env.MAX_UNPR_MINUTES)*60000, now=Date.now();
            const permanent=(process.env.PERMANENT_BRANCH_PATTERNS||'').split(/\s+/).filter(Boolean);
            const marker='Den här PR:n öppnades automatiskt av `PR watchdog`.';
            const isPermanent=(name)=>permanent.some((pattern)=>pattern.endsWith('/*')?name.startsWith(pattern.slice(0,-1)):name===pattern);
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            for(const branch of branches){
              const name=branch.name;
              if(name===base||name.startsWith('gh-readonly-queue/')||isPermanent(name))continue;
              core.startGroup(name);
              try{
                const headSha=branch.commit.sha;
                const comparison=await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:`${base}...${name}`});
                if(comparison.data.ahead_by===0)continue;
                const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',head:`${owner}:${name}`,per_page:100});
                let pr=open[0];
                if(pr){
                  if(pr.base.ref!==base||!(pr.body||'').includes(marker))continue;
                }else{
                  const closed=await github.paginate(github.rest.pulls.list,{owner,repo,state:'closed',head:`${owner}:${name}`,per_page:100});
                  if(closed.some((candidate)=>candidate.head?.sha===headSha))continue;
                  const tip=await github.rest.repos.getCommit({owner,repo,ref:headSha});
                  const committedAt=tip.data.commit.committer?.date||tip.data.commit.author?.date;
                  if(!committedAt||now-Date.parse(committedAt)<=maxAgeMs)continue;
                  const currentBranch=await github.rest.repos.getBranch({owner,repo,branch:name});
                  if(currentBranch.data.commit.sha!==headSha)continue;
                  const ageMinutes=Math.floor((now-Date.parse(committedAt))/60000);
                  const title=(tip.data.commit.message||'').split('\n')[0].trim()||`auto: öppna PR för ${name}`;
                  const body=[marker,'',`Branch \`${name}\` har unika commits jämfört med \`${base}\` och har saknat öppen PR i mer än ${ageMinutes} minuter.`,`Watchdog-tip: \`${headSha.slice(0,7)}\`.`, '', 'Watchdoggen bedömer inte om arbetet ska mergas. Auto-merge armeras direkt; required checks, relevanta review-trådar och merge queue måste fortfarande passera före squash merge.'].join('\n');
                  try{
                    pr=(await github.rest.pulls.create({owner,repo,head:name,base,title,body,draft:false,maintainer_can_modify:true})).data;
                  }catch(error){
                    if(error.status!==422)throw error;
                    const raced=await github.rest.pulls.list({owner,repo,state:'open',head:`${owner}:${name}`,per_page:100});
                    pr=raced.data.find((candidate)=>candidate.base.ref===base);
                    if(!pr||!(pr.body||'').includes(marker))continue;
                  }
                }
                const node=await github.graphql(`query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id autoMergeRequest{enabledAt}}}}`,{owner,repo,number:pr.number});
                if(node.repository.pullRequest.autoMergeRequest)continue;
                await github.graphql(`mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{number}}}`,{id:node.repository.pullRequest.id});
              }finally{core.endGroup();}
            }
