name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      # Villkoret sitter på steget och inte på jobbet. Ett överhoppat jobb
      # rapporterar en grå check på varje PR som inte är Dependabots; så här
      # blir den grön och gör ingenting.
      - if: github.actor == 'dependabot[bot]'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
