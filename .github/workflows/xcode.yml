name: Apple

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    name: CI / apple
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.4.1"
      - run: brew install xcodegen
      - run: cd App && xcodegen generate
      - name: Ensure tvOS runtime
        run: |
          xcrun simctl list runtimes available | grep -q tvOS || xcodebuild -downloadPlatform tvOS
      - name: Build apps
        run: |
          xcodebuild build -skipPackagePluginValidation -project App/Bastion.xcodeproj -scheme Bastion -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          xcodebuild build -skipPackagePluginValidation -project App/Bastion.xcodeproj -scheme Bastion-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
          xcodebuild build -skipPackagePluginValidation -project App/Bastion.xcodeproj -scheme Bastion-tvOS -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Test Swift package
        run: |
          swift build
          swift test
