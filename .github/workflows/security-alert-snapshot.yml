name: Skapa Issues för säkerhetsalerts

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: security-alert-issues
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skapa Issues för öppna security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_list() { local endpoint="$1" output="$2" pages="${2}.pages"; if gh api --paginate --slurp -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$endpoint" > "$pages" 2>/dev/null; then jq 'add // []' "$pages" > "$output"; else printf '[]\n' > "$output"; fi; }
          api_list "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" /tmp/code.json
          api_list "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" /tmp/dependabot.json
          gh issue list --state all --limit 1000 --json number,body > /tmp/issues.json
          exists() { jq -e --arg m "$1" '.[] | select((.body // "") | contains($m))' /tmp/issues.json >/dev/null; }
          while IFS= read -r a; do n="$(jq -r '.number' <<<"$a")"; m="<!-- security-alert:code-scanning:${n} -->"; exists "$m" && continue; sev="$(jq -r '(.rule.security_severity_level // .rule.severity // "unknown")|ascii_upcase' <<<"$a")"; rule="$(jq -r '.rule.name // .rule.id // "Code scanning alert"' <<<"$a")"; url="$(jq -r '.html_url' <<<"$a")"; gh issue create --title "[Security][Code scanning][${sev}] ${rule}" --body "${m}
Automatiskt skapat från ett öppet GitHub Code Scanning-alert.

- **Severity:** ${sev}
- **Rule:** ${rule}
- **Alert:** ${url}" >/dev/null; done < <(jq -c '.[]' /tmp/code.json)
          while IFS= read -r a; do n="$(jq -r '.number' <<<"$a")"; m="<!-- security-alert:dependabot:${n} -->"; exists "$m" && continue; sev="$(jq -r '(.security_advisory.severity // "unknown")|ascii_upcase' <<<"$a")"; pkg="$(jq -r '.dependency.package.name // "unknown package"' <<<"$a")"; summary="$(jq -r '.security_advisory.summary // "Dependabot vulnerability or malware alert"' <<<"$a")"; url="$(jq -r '.html_url' <<<"$a")"; gh issue create --title "[Security][Dependabot][${sev}] ${pkg}: ${summary}" --body "${m}
Automatiskt skapat från ett öppet GitHub Dependabot-alert, inklusive vulnerability- och malware-alerts.

- **Severity:** ${sev}
- **Package:** ${pkg}
- **Summary:** ${summary}
- **Alert:** ${url}" >/dev/null; done < <(jq -c '.[]' /tmp/dependabot.json)
