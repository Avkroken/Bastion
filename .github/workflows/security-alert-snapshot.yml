name: Security alert snapshot

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: security-alert-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta öppna Code Scanning-alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
          | jq 'add | map({number, tool: .tool.name, rule_id: .rule.id, rule_name: .rule.name, severity: (.rule.security_severity_level // .rule.severity), created_at, updated_at, url: .html_url, ref: .most_recent_instance.ref, category: .most_recent_instance.category, file: .most_recent_instance.location.path, start_line: .most_recent_instance.location.start_line, end_line: .most_recent_instance.location.end_line})' > code-scanning-alerts.json
          count=$(jq 'length' code-scanning-alerts.json)
          echo "### Code Scanning snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "Öppna alerts: **$count**" >> "$GITHUB_STEP_SUMMARY"
      - name: Ladda upp snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-scanning-alerts
          path: code-scanning-alerts.json
          if-no-files-found: error
          retention-days: 7
