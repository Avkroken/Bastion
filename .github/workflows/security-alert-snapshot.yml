name: Security alert snapshot

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  id-token: write

concurrency:
  group: security-alert-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta öppna Code Scanning-alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
          | jq 'add | map({number, tool: .tool.name, rule_id: .rule.id, rule_name: .rule.name, severity: (.rule.security_severity_level // .rule.severity), created_at, updated_at, url: .html_url, ref: .most_recent_instance.ref, category: .most_recent_instance.category, file: .most_recent_instance.location.path, start_line: .most_recent_instance.location.start_line, end_line: .most_recent_instance.location.end_line})' > code-scanning-alerts.json
          echo "Öppna alerts: $(jq 'length' code-scanning-alerts.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Spara snapshot privat i D1
        run: |
          set -euo pipefail
          oidc=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=politiker-security-alerts" | jq -r .value)
          jq -n --slurpfile alerts code-scanning-alerts.json '{alerts: $alerts[0]}' \
          | curl --fail-with-body -fsS \
              -H "X-GitHub-OIDC: $oidc" \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              https://security-alerts.denied.se/v1/code-scanning
