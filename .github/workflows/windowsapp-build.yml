name: WindowsApp-bygge (WinUI 3/.NET)

# Bygger den native WinUI 3-klienten i WindowsApp/ och kör kärnans tester.
# PR-CI körs mot main; separat push-CI på dev skulle annars dubblera samma
# commit när dev har en öppen PR. Det dyra Windows-jobbet körs bara när
# impact-detektorn visar faktisk Windows-påverkan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windowsapp-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.impact.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm CI-påverkan
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-impact.sh

  windowsapp-core-tests:
    needs: impact
    if: ${{ needs.impact.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Installera OpenSSH (testerna kör mot en riktig sshd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet test (Bastion.Core)
        run: dotnet test WindowsApp/Bastion.Core.Tests/Bastion.Core.Tests.csproj -c Release --verbosity normal

  windowsapp-build:
    needs: impact
    if: ${{ needs.impact.outputs.windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet build (WinUI 3, x64)
        run: dotnet build WindowsApp/WindowsApp.csproj -c Release -p:Platform=x64
