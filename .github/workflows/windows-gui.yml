name: Windows-GUI-bygge

# Bygger WindowsApp/ (bastion-gui, SwiftCrossUI/WinUIBackend) — eget paket,
# se WindowsApp/Package.swift för varför. Ingen lokal Windows-maskin att
# testa på ännu, så CI är den enda verifieringen. Setup-stegen (gha-setup-
# vsdevenv + gha-setup-swift) speglar exakt swift-cross-ui:s egen CI-jobb
# "windows", som bygger WinUIBackend framgångsrikt med samma kombination.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windowsapp-build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # bash saknas i praktiken för Swift-utveckling på Windows, se
        # compnerd/gha-setup-swift#18.
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Sätt upp VS-devmiljö (MSVC-verktyg som Swift-linker behöver)
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      - name: Installera Swift
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE

      - name: Visa Swift-version
        run: swift --version

      # swift build körde ~21 av byggets ~22 minuter helt utan cache — hela
      # beroendeträdet (SwiftCrossUI, WinUIBackend, SSHCore) kompilerades om
      # från grunden varje gång. .build innehåller både uppackade dependency-
      # checkouts och kompilerade artefakter, så en träff hoppar över båda.
      # Ingen Package.resolved committad här → nyckla på Package.swift-hashen
      # (både WindowsApp/ och rot-paketet, eftersom WindowsApp beror på
      # .package(path: "..")); restore-keys ger en delvis träff även när
      # manifestet ändrats.
      - name: Cacha .build (SwiftPM-beroenden + byggartefakter)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: WindowsApp/.build
          key: windows-swiftpm-build-${{ hashFiles('WindowsApp/Package.swift', 'Package.swift') }}
          restore-keys: |
            windows-swiftpm-build-

      - name: Bygg bastion-gui
        # -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH: windows-latest-runnerns
        # MSVC-STL (14.51, VS 2026) kräver Clang 20+ i sina headers, men
        # Swift 6.1-RELEASE bundlar Clang 19 — swift-cryptos C++-beroende
        # (CCryptoBoringSSL) kraschar annars med "error STL1000: Unexpected
        # compiler version". Detta är MSVC STL:s egen, avsedda escape-hatch
        # för kända men versionsolika verktygskedjor, inte en risk-flagga.
        # (Den här fixen godkändes redan 2026-07-04 (commit ebb50fe), men
        # branchen den låg på blev aldrig mergad innan den blev konfliktig
        # och stängdes — precis samma öde som Xcode-versionspinnen i
        # xcode.yml. Applicerar den permanent här istället.)
        run: |
          cd WindowsApp
          swift build --product bastion-gui -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
