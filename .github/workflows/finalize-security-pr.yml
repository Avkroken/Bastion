name: Finalize security PR

on: push

permissions: {}

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Create Gamnacken App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-pull-requests: write
      - name: Mark existing PR ready for review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "383"
        run: |
          set -euo pipefail
          PR_ID="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .node_id)"
          gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' -f id="$PR_ID"
