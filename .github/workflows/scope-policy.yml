name: Scope policy

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  scope-policy:
    name: scope-policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validera branch-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == merge_group ]] && exit 0
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRDTUXB "$BASE_SHA" "$HEAD_SHA")
          [[ ${#files[@]} -gt 0 ]]

          if [[ "$HEAD_REF" == 'automation/security-reports' ]]; then
            [[ ${#files[@]} -eq 1 && "${files[0]}" == 'security/code-scanning-alerts.log' ]]
            [[ ! -L security/code-scanning-alerts.log ]]
            jq -e 'type=="array" and all(.[]; type=="object" and ((keys|sort)==(["category","created_at","end_line","file","number","ref","rule_id","rule_name","severity","start_line","tool","updated_at","url"]|sort)))' security/code-scanning-alerts.log >/dev/null
            exit 0
          fi

          if [[ "$HEAD_REF" == 'platform/windows' ]]; then
            for file in "${files[@]}"; do
              [[ "$file" == WindowsApp/* ]] || { echo "Otillåten Windows-branchfil: $file" >&2; exit 1; }
            done
          fi
