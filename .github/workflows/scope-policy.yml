name: Scope policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scope-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate scoped branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            platform/windows) allowed='^WindowsApp/' ;;
            platform/android) allowed='^Android/' ;;
            platform/linux) allowed='^LinuxApp/' ;;
            platform/apple) allowed='^App/' ;;
            platform/cli) allowed='^Sources/bastion-cli/' ;;
            core/swift) allowed='^(Sources/SSHCore/|Tests/SSHCoreTests/|Package\.swift$|Package\.resolved$)' ;;
            *) exit 0 ;;
          esac
          while IFS= read -r file; do
            [[ "$file" =~ $allowed ]] || { echo "::error::$file is outside $HEAD_REF scope"; exit 1; }
          done < <(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")
