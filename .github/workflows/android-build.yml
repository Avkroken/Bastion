name: Android-bygge

# Bygger Android/ (Kotlin/Gradle, Apache MINA SSHD). Workflowet är inte
# required och körs bara när Android-koden eller workflowet självt ändras.
# PR-CI körs mot main; separat push-CI på dev skulle dubblera samma commit.
on:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Sätt upp JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bygg + testa (gradlew build kör redan test via check-tasken)
        run: |
          cd Android
          chmod +x gradlew
          ./gradlew build --stacktrace
