name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = re.compile(
              r"^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)"
              r"(\((?!\s*\))[^)]+\))?!?: [^\s].*$"
          )
          title = os.environ.get("PR_TITLE", "").strip()
          if pattern.fullmatch(title):
              print(f"PR title follows Conventional Commits: {title}")
              sys.exit(0)

          print(
              "::error title=Invalid PR title::Use Conventional Commits, for example: "
              "feat: add capability, fix(runtime): preserve behavior, "
              "chore: maintain repository, or feat!: change a public contract."
          )
          print(f"Received: {title!r}")
          sys.exit(1)
          PY

      - name: Preserve required check in merge queue
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "PR titles were validated before entering the merge queue."
