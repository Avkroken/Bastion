name: Cleartext log remediation

on: push

jobs:
  remediate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Apply verified CodeQL fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('LinuxApp/src/key_deploy.rs')
          text = path.read_text()
          old = 'assert!(result.is_ok(), "deploy+verify misslyckades: {result:?}");'
          new = 'assert!(result.is_ok(), "deploy+verify misslyckades");'
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/codex-dispatch/issue-377.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LinuxApp/src/key_deploy.rs .github/codex-dispatch/issue-377.md
          git commit -m "fix(security): keep deploy credentials out of test logs"
          git push origin HEAD:work/fix
