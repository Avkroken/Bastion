name: Skapa Issues för säkerhetsalerts

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: security-alert-issues
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skapa Issues för öppna security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_list() { local endpoint="$1" output="$2" pages="${2}.pages"; if gh api --paginate --slurp -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$endpoint" > "$pages" 2>/dev/null; then jq 'add // []' "$pages" > "$output"; else printf '[]\n' > "$output"; fi; }
          api_list "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" /tmp/code-all.json
          jq '[.[] | select((.rule.security_severity_level // "") as $s | ["medium","high","critical"] | index($s))]' /tmp/code-all.json > /tmp/code.json
          api_list "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&severity=medium,high,critical&per_page=100" /tmp/dependabot-severity.json
          api_list "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&classification=malware&per_page=100" /tmp/dependabot-malware.json
          jq -s 'add | unique_by(.number)' /tmp/dependabot-severity.json /tmp/dependabot-malware.json > /tmp/dependabot.json
          gh issue list --state all --limit 1000 --json number,body > /tmp/issues.json
          exists() { jq -e --arg m "$1" '.[] | select((.body // "") | contains($m))' /tmp/issues.json >/dev/null; }
          while IFS= read -r a; do n="$(jq -r '.number' <<<"$a")"; marker="<!-- security-alert:code-scanning:${n} -->"; exists "$marker" && continue; severity="$(jq -r '.rule.security_severity_level | ascii_upcase' <<<"$a")"; rule="$(jq -r '.rule.name // .rule.id // "Code scanning alert"' <<<"$a")"; url="$(jq -r '.html_url' <<<"$a")"; gh issue create --title "[Security][Code scanning][${severity}] ${rule}" --body "${marker}
Automatiskt skapat från ett öppet GitHub Code Scanning-alert med severity Medium eller högre.

- **Severity:** ${severity}
- **Rule:** ${rule}
- **Alert:** ${url}" >/dev/null; done < <(jq -c '.[]' /tmp/code.json)
          while IFS= read -r a; do n="$(jq -r '.number' <<<"$a")"; marker="<!-- security-alert:dependabot:${n} -->"; exists "$marker" && continue; if jq -e --argjson n "$n" '.[] | select(.number == $n)' /tmp/dependabot-malware.json >/dev/null; then severity="MALWARE"; kind="malware"; else severity="$(jq -r '(.security_advisory.severity // .security_vulnerability.severity // "unknown") | ascii_upcase' <<<"$a")"; kind="vulnerability"; fi; pkg="$(jq -r '.dependency.package.name // "unknown package"' <<<"$a")"; summary="$(jq -r '.security_advisory.summary // "Malicious dependency detected"' <<<"$a")"; url="$(jq -r '.html_url' <<<"$a")"; gh issue create --title "[Security][Dependabot][${severity}] ${pkg}: ${summary}" --body "${marker}
Automatiskt skapat från ett öppet GitHub Dependabot-${kind}-alert. Vanliga vulnerability-alerts kräver severity Medium eller högre; malware-alerts inkluderas alltid.

- **Severity/class:** ${severity}
- **Package:** ${pkg}
- **Summary:** ${summary}
- **Alert:** ${url}" >/dev/null; done < <(jq -c '.[]' /tmp/dependabot.json)
