name: OSV-Scanner

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '40 4 * * 1'

permissions: {}

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-merge:
    if: github.event_name == 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: true

  scan-main:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: false

  osv:
    name: osv
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs: [scan-pr, scan-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Verify OSV gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "${{ needs.scan-pr.result }}" == "success" ]]
          else
            [[ "${{ needs.scan-merge.result }}" == "success" ]]
          fi
