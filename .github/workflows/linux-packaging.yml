name: CLI Debian package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-debian-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: swift build -c release --product bastion-cli --static-swift-stdlib
      - run: |
          command -v readelf >/dev/null || { apt-get update -qq; apt-get install -y -qq binutils; }
      - id: deps
        run: |
          set -euo pipefail
          needed=$(readelf -d .build/release/bastion-cli | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
          if grep -qi libswift <<<"$needed"; then
            echo "::error::bastion-cli still depends on the dynamic Swift runtime."
            exit 1
          fi
          packages=()
          while IFS= read -r lib; do
            [[ -n "$lib" ]] || continue
            case "$lib" in libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libutil.so*|ld-linux*|linux-vdso*) continue;; esac
            path=$(ldconfig -p | awk -v lib="$lib" '$1 == lib { print $NF; exit }')
            [[ -n "$path" ]] || { echo "::error::Could not locate $lib"; exit 1; }
            pkg=$(dpkg -S "$(readlink -f "$path")" | head -1 | cut -d: -f1 | cut -d, -f1 | xargs)
            [[ -n "$pkg" ]] || { echo "::error::Could not map $lib to a Debian package"; exit 1; }
            packages+=("$pkg")
          done <<< "$needed"
          extra=$(printf '%s\n' "${packages[@]}" | sort -u | grep -v '^$' | grep -v '^libc6$' | paste -sd, - | sed 's/,/, /g')
          echo "depends=libc6${extra:+, $extra}" >> "$GITHUB_OUTPUT"
      - name: Build package
        env:
          VERSION: ${{ steps.version.outputs.version || '0.0.0' }}
          DEPENDS: ${{ steps.deps.outputs.depends }}
        run: |
          root="dist/bastion-cli_${VERSION}_amd64"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" dist-out
          install -m 755 .build/release/bastion-cli "$root/usr/bin/bastion-cli"
          cat > "$root/DEBIAN/control" <<EOF
          Package: bastion-cli
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: blixten85 <noreply@github.com>
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Depends: $DEPENDS
          Description: Bastion SSH command-line client
          EOF
          dpkg-deb --build --root-owner-group "$root"
          mv "dist/bastion-cli_${VERSION}_amd64.deb" dist-out/
          dpkg -i dist-out/*.deb
          set +e; output=$(bastion-cli 2>&1); status=$?; set -e
          test "$status" -eq 2
          grep -q 'Användning:' <<<"$output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bastion-cli-deb
          path: dist-out/*.deb
