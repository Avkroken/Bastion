[package]
name = "bastion-linuxapp"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
russh = "0.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
async-channel = "2"
async-trait = "0.1"
vte = { version = "0.10", package = "vte4" }
russh-sftp = "2.3.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = "0.11.0"
aes-gcm = "0.11.0"
rand = "0.10.2"
base64 = "0.22"
hmac = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.37"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
