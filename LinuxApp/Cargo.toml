[package]
name = "bastion-linuxapp"
version = "0.1.0"
edition = "2024"
# Lägsta Rust-version som faktiskt bygger projektet. VERIFIERAD, inte
# antagen: `cargo +1.92 build` + hela testsviten (203/203) kördes på
# just den toolchainen. Sätts inte av vår egen kod — `edition = "2024"`
# kräver bara 1.85 — utan av GTK-stacken, som höjde sitt krav till 1.92
# (`gdk4`/`cairo-rs`/`gio`). Utan det här fältet får den som har en för
# gammal toolchain ett kryptiskt syntaxfel i stället för ett tydligt
# "requires rustc 1.92".
#
# CI kör `dtolnay/rust-toolchain@stable`, alltså alltid SENASTE stabila —
# det här är golvet, inte vad vi bygger med till vardags. Höj det när ett
# beroende kräver mer (bygget säger då själv vilken version), och kör om
# testsviten på den nya siffran så den förblir verifierad.
rust-version = "1.92"

# Integrationerna (Docker/Kubernetes/Proxmox) ligger i ett EGET paket,
# vilket VISION efterfrågar som "alla plugins separata paket". Gränsen är
# inte kosmetisk: paketet har noll beroenden, så ingenting där kan nå
# GTK, russh eller filsystemet ens av misstag.
[workspace]
members = ["integrations"]

[dependencies]
bastion-integrations = { path = "integrations" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
# RSA-stödet är AVSTÄNGT, inte bara oanvänt: `rsa`-crate:n dras in av
# russh:s default-feature `rsa` och har RUSTSEC-2023-0071 (Marvin-attacken)
# utan rättad version. `default-features = false` tar bort den ur
# beroendeträdet helt. `flate2` och `aws-lc-rs` är de övriga två
# default-featuresen och måste därför återaktiveras uttryckligen.
# Slå på `rsa` igen när advisoryn har en fix — se docs/RSA-INAKTIVERAT.md.
russh = { version = "0.62", default-features = false, features = ["flate2", "aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
async-channel = "2"
async-trait = "0.1"
vte = { version = "0.10", package = "vte4" }
russh-sftp = "2.4.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = "0.11.0"
aes-gcm = "0.11.0"
rand = "0.10.2"
base64 = "0.23"
hmac = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Uppackning av hämtade verktygsarkiv (se `external_binary_fetcher`).
# Tailscale levererar en `.tgz`, inte en naken binär. Rena Rust-crates
# utan C-beroenden, och `flate2` fanns redan i trädet via reqwest.
tar = "0.4"
flate2 = "1"
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
# Syntax highlighting i SFTP-editorn. Inga versionsfeatures (`v5_10`,
# `v5_12` …) — de kräver ett nyare GtkSourceView än den äldsta distro vi
# paketerar för kan ha, och inget vi använder behöver dem. Basnivån räcker.
sourceview5 = { version = "0.11", default-features = false }
